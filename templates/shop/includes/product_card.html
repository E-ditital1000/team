<div class="col">
    <div class="card h-100">
        {% if product.image %}
            <img src="{{ product.image.url }}" class="card-img-top" alt="{{ product.name }}" style="height: 200px; object-fit: cover;">
        {% endif %}
        <div class="card-body">
            <h5 class="card-title text-truncate">{{ product.name }}</h5>
            <p class="card-text text-muted">{{ product.category.name }}</p>
            {% if product.discount_price %}
                <p class="mb-0">
                    <span class="h5 text-primary">${{ product.discount_price }}</span>
                    <span class="small text-muted text-decoration-line-through">${{ product.price }}</span>
                </p>
            {% else %}
                <p class="h5 text-primary mb-0">${{ product.price }}</p>
            {% endif %}
        </div>
        <div class="card-footer bg-transparent border-top-0">
            <a href="{% url 'shop:product_detail' product.slug %}" class="btn btn-outline-primary btn-sm w-100">View Details</a>
        </div>
    </div>
</div>
